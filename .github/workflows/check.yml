name: Validate dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data and generated HTML
        run: python3 tools/validate.py
      - name: Check JavaScript syntax
        run: node --check src/dashboard.js
