const sum=(rs,k)=>{const v=rs.filter(r=>num(r[k]));return v.length?v.reduce((s,r)=>s+r[k],0):null};
const add=(x,n)=>{const d=new Date(x+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const monday=x=>add(x,-((new Date(x+'T12:00:00Z').getUTCDay()+6)%7));
const week=(n=0)=>{const start=add(monday(state.week),n*7);return {start,end:add(start,6)}};
const inside=(x,w)=>!!x&&x>=w.start&&x<=w.end;
const md=x=>x?`${Number(x.slice(5,7))}/${Number(x.slice(8,10))}`:'待排期';
const dateLong=x=>x?x.replaceAll('-','.'): '未填';
const complete=r=>!!r.actualDate&&r.actualDate<=ASOF;
const base=()=>DATA.records.filter(r=>(state.workstream==='all'||r.workstream===state.workstream||r.substream===state.workstream)&&(state.owner==='all'||r.owner===state.owner));
const stats=rs=>{const completed=rs.filter(complete),eligible=completed.filter(r=>r.plannedDate);return {n:rs.length,target:sum(rs,'targetAmount'),targetFilled:rs.filter(r=>num(r.targetAmount)).length,amount:sum(rs,'actualAmount'),amountFilled:rs.filter(r=>num(r.actualAmount)).length,completed:completed.length,eligible:eligible.length,onTime:eligible.filter(r=>r.actualDate<=r.plannedDate).length,unscheduled:rs.filter(r=>!r.plannedDate).length}};
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;
const sub=t=>`<div class="cell-sub">${t}</div>`;
const status=r=>complete(r)?['已填完成日','green']:r.actualDate?['完成日期晚于快照','amber']:!r.plannedDate?['待排期','amber']:r.plannedDate<ASOF?['已过截止日 · 待确认','amber']:r.plannedDate===ASOF?['今日到期 · 待确认','amber']:['已排期 · 待回填','outline'];
const notice=t=>`<div class="notice"><span class="index">i</span><div>${t}</div></div>`;
const section=(title,desc,body,action='')=>`<section class="section"><div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>${body}</section>`;
const kpi=(label,value,unit,foot,accent='')=>`<article class="kpi ${accent}"><div class="label">${label}</div><div class="value">${value}${unit?`<small>${unit}</small>`:''}</div><div class="foot">${foot}</div></article>`;
const dateSort=(a,b)=>(a.plannedDate||'9999').localeCompare(b.plannedDate||'9999')||(b.targetAmount??-1)-(a.targetAmount??-1);
function weekCards(rs){return `<div class="weeks">${[-1,0,1].map(n=>{const w=week(n),planned=rs.filter(r=>inside(r.plannedDate,w)),done=rs.filter(r=>complete(r)&&inside(r.actualDate,w)),label=n===-1?'上周':n===0?'本周':'下周';return `<article class="week-card ${n===0?'current':''}"><div class="week-head"><h3>${label}</h3>${chip(`${md(w.start)} – ${md(w.end)}`,n===0?'green':'outline')}</div><div class="numbers"><b>${planned.length}</b><span>家按目标完成日到期</span></div><div class="small">对应已填目标 ${planned.length?money(sum(planned,'targetAmount')):0} 万元</div><div class="week-facts"><span>已填完成日记录</span><b>${done.length} 家</b></div><div class="week-facts"><span>${n<0?'已谈数量':'约谈日期'}</span><b>未单独记录</b></div><button class="textbtn" data-period="${n===-1?'last':n===0?'this':'next'}">查看${label}供应商 →</button></article>`}).join('')}</div>`}
function stagePanel(rs){const m=stats(rs);return `<div class="panel"><div class="panel-top"><div><h3>完成日期、返利与兑现</h3><p>不同阶段分开记录与确认。</p></div></div><div class="action-list">${[
 [String(m.completed),'家已填实际完成日',`${m.completed} / ${m.n} 家；没有日期的记录仍待确认。`],
 [m.amountFilled?money(m.amount):'待补','表内实际返利金额',`${m.amountFilled} / ${m.n} 家已填；未填金额不按零处理。`],
 [m.eligible?pct(m.onTime,m.eligible):'待补','有日期样本按时率',`${m.onTime} / ${m.eligible} 家；仅限同时有目标与完成日期的已完成记录。`],
 ['待补','财务确认 / 实际兑现','未设置独立金额、日期与凭证，不能用目标或完成日期替代。']
 ].map(([v,t,d])=>`<div class="action-row"><div class="action-num">${v}</div><div class="action-copy"><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div></div>`}
function targetPanel(rs){const m=stats(rs),missing=m.n-m.targetFilled;return `<div class="panel"><div class="panel-top"><div><h3>目标分解情况</h3><p>仅汇总有供应商级金额的记录。</p></div>${chip(missing?'目标未齐':'目标已填',missing?'amber':'green')}</div><div class="metric-inline"><div><div class="big">${money(m.target)}<small>万元</small></div><div class="small">已分解目标</div></div><div><div class="big">${m.targetFilled} / ${m.n}</div><div class="small">目标金额已填记录</div></div></div><div class="bar-rows"><div class="bar-label"><span>目标填报覆盖</span><b>${pct(m.targetFilled,m.n)}</b></div><div class="bar green"><i style="width:${m.n?m.targetFilled/m.n*100:0}%"></i></div></div><p class="panel-note">${missing?`${missing} 家目标金额仍待补，不计为零。`:'当前筛选范围的目标金额均已填写。'} 该比例是数据覆盖率，不是降本达成率。</p></div>`}
function categories(rs){return `<div class="workstream-block">${['BOM','non-BOM 模具','non-BOM 工装','non-BOM 物流'].map(name=>{const rows=rs.filter(r=>r.substream===name);if(!rows.length)return '';const m=stats(rows);return `<div class="panel category-card"><div class="panel-top"><h3>${name}</h3>${chip(`${m.n} 家`,'outline')}</div><div class="category-main"><b>${money(m.target)}</b><span>${num(m.target)?'万元已分解目标':'供应商级目标金额'}</span></div><div class="category-metrics"><div><small>目标已填</small><b>${m.targetFilled} / ${m.n} 家</b></div><div><small>完成日已填</small><b>${m.completed} 家</b></div><div><small>待排期</small><b>${m.unscheduled} 家</b></div></div>${name==='non-BOM 模具'?`<p class="panel-note">模具表汇总参考 ${money(DATA.summary.moldReferenceAmount)} 万元（K37=${esc(DATA.summary.moldReferenceFormula)}），尚未逐家分解，未计入上方已分解目标。</p>`:''}</div>`}).join('')}</div>`}
function ownerTable(rs){const owners=[...new Set(rs.map(r=>r.owner))].map(owner=>({owner,rows:rs.filter(r=>r.owner===owner)})).sort((a,b)=>(sum(b.rows,'targetAmount')??-1)-(sum(a.rows,'targetAmount')??-1));return `<div class="panel table-panel"><div class="table-scroll" role="region" aria-label="负责人进度表，可横向滚动" tabindex="0"><table class="owner-table"><thead><tr><th>负责人 / 范围</th><th class="num">供应商</th><th class="num">已分解目标 / 万元</th><th class="num">完成日已填</th><th class="num">实际返利 / 万元</th><th class="num">本周到期</th><th class="num">下周到期</th><th class="num">待排期</th><th>有日期样本按时率</th></tr></thead><tbody>${owners.map(({owner,rows})=>{const m=stats(rows),cur=rows.filter(r=>inside(r.plannedDate,week())),next=rows.filter(r=>inside(r.plannedDate,week(1)));return `<tr><td><div class="owner-cell"><span class="avatar">${esc(owner.slice(-1))}</span><button data-owner="${esc(owner)}"><strong>${esc(owner)}</strong>${sub([...new Set(rows.map(r=>esc(r.substream)))].join('、'))}</button></div></td><td class="num">${m.n}</td><td class="num">${money(m.target)}${sub(`${m.targetFilled} / ${m.n} 家已填`)}</td><td class="num">${m.completed} / ${m.n}</td><td class="num">${money(m.amount)}${sub(`${m.amountFilled} 家已填金额`)}</td><td class="num">${cur.length} 家${sub(`${cur.length?money(sum(cur,'targetAmount')):0} 万元`)}</td><td class="num">${next.length} 家${sub(`${next.length?money(sum(next,'targetAmount')):0} 万元`)}</td><td class="num">${m.unscheduled} 家</td><td>${m.eligible?pct(m.onTime,m.eligible):'暂不可算'}${sub(`样本 ${m.eligible} 家`)}</td></tr>`}).join('')}</tbody></table></div><div class="table-footer">点击姓名进入个人工作台。已谈次数和实际兑现仍需独立记录。</div></div>`}
function supplierTable(rs){return `<div class="panel table-panel"><div class="table-scroll" role="region" aria-label="供应商明细表，可横向滚动" tabindex="0"><table class="supplier-table"><thead><tr><th>供应商 / 品类</th><th>负责人</th><th class="num">目标 / 万元</th><th class="num">目标返利率</th><th>目标完成日</th><th>实际完成日</th><th class="num">实际返利 / 万元</th><th>进度记录</th><th>来源</th></tr></thead><tbody>${rs.length?rs.map(r=>`<tr><td><button class="row-action" data-record="${esc(r.id)}"><strong>${esc(r.supplier)}</strong></button>${sub(`${esc(r.substream)} · ${esc(r.category)}`)}</td><td>${esc(r.owner)}</td><td class="num">${money(r.targetAmount)}</td><td class="num">${num(r.targetRebateRate)?pct(r.targetRebateRate,1):'待补'}</td><td>${r.plannedDate?dateLong(r.plannedDate):'待排期'}</td><td>${dateLong(r.actualDate)}</td><td class="num">${money(r.actualAmount)}</td><td>${chip(...status(r))}</td><td><button class="textbtn" data-record="${esc(r.id)}">第 ${r.sourceRow} 行 ↗</button></td></tr>`).join(''):'<tr><td colspan="9"><div class="empty">当前筛选下没有记录，可切换负责人或任务期间。</div></td></tr>'}</tbody></table></div></div>`}
function dailyPlan(rs){const dates=[...new Set(rs.map(r=>r.plannedDate).filter(Boolean))].sort(),max=Math.max(1,...dates.map(day=>sum(rs.filter(r=>r.plannedDate===day),'targetAmount')??0));return `<div class="panel"><div class="bar-rows">${dates.map(day=>{const rows=rs.filter(r=>r.plannedDate===day),amount=sum(rows,'targetAmount');return `<div><div class="bar-label"><span>${md(day)} · ${rows.length} 家</span><b>${money(amount)} 万元</b></div><div class="bar ${day===ASOF?'green':''}"><i style="width:${(amount??0)/max*100}%"></i></div></div>`}).join('')||'<p>当前范围尚未填写目标完成日期。</p>'}</div></div>`}
function overview(rs){const m=stats(rs);return `<div class="kpis">${kpi('已分解目标',money(m.target),num(m.target)?'万元':'',`${m.targetFilled} / ${m.n} 家已填目标`,'accent')}${kpi('已登记供应商',m.n,'家',`${new Set(rs.map(r=>r.owner)).size} 位负责人 · BOM / non-BOM`)}${kpi('已填实际完成日',m.completed,'家',`实际返利金额已填 ${m.amountFilled} 家`)}${kpi('待补目标完成日',m.unscheduled,'家','在行动计划中查看“待排期”')}</div>${notice(`当前筛选范围已填完成日 ${m.completed} 家；实际金额已填 ${m.amountFilled} 家。日期完成、返利金额与财务兑现分别管理。`)}<div class="section grid2">${targetPanel(rs)}${stagePanel(rs)}</div>${section('采购范围与成果','按分类查看目标覆盖、完成记录和待排期任务。',categories(rs))}${section('周节奏','按目标完成日归集；未排期记录单独保留。',weekCards(rs),'<button class="ghost" data-period="unscheduled">查看待排期 →</button>')}${section('负责人进度','查看每个人的目标、完成日期与下一步安排。',ownerTable(rs))}${section('每日目标排期','横向条形图按目标完成日汇总，金额单位为万元。',dailyPlan(rs))}${section('全表数据待核对','以下来源问题不随负责人筛选。',`<div class="workstream-block">${DATA.issues.map(i=>`<div class="panel"><h3>${esc(i.title)}</h3><p class="panel-note">${esc(i.detail)}</p><button class="textbtn" data-method>查看来源与口径 →</button></div>`).join('')}</div>`)}`}
function ownersView(rs){const m=stats(rs);return `${state.owner!=='all'?`<div class="person-banner"><span class="avatar">${esc(state.owner.slice(-1))}</span><div><h2>${esc(state.owner)}的工作台</h2><p>${m.n} 家供应商；目标已填 ${m.targetFilled} 家。</p></div></div>`:''}<div class="kpis">${kpi('累计已分解目标',money(m.target),num(m.target)?'万元':'',`${m.n-m.targetFilled} 家目标待补`)}${kpi('累计已填完成日',m.completed,'家',`已谈次数没有独立记录`)}${kpi('表内实际返利',money(m.amount),num(m.amount)?'万元':'',`${m.amountFilled} / ${m.n} 家已填金额`)}${kpi('有日期样本按时率',m.eligible?pct(m.onTime,m.eligible):'待补','',`${m.onTime} / ${m.eligible} 家；不代表全部供应商`)}</div>${section('本人与团队进度','选择负责人，或点击姓名进入个人工作台。',ownerTable(rs))}${section('周计划','无目标完成日期的供应商不会挤入任何一周。',weekCards(rs),'<button class="ghost" data-period="unscheduled">查看待排期 →</button>')}${section('供应商工作安排','按目标完成日期排序；点击供应商查看原表字段。',supplierTable(rs.slice().sort(dateSort).slice(0,10)),'<button class="ghost" data-view="plan">查看全部工作计划 →</button>')}`}
const periodLabels={today:'今日到期',last:'上周到期',this:'本周到期',next:'下周到期',next7:'未来 7 天',past:'已过截止日',unscheduled:'待排期',all:'全部排期'};
function periodRows(rs){if(state.period==='all')return rs;if(state.period==='unscheduled')return rs.filter(r=>!r.plannedDate);if(state.period==='today')return rs.filter(r=>r.plannedDate===ASOF);if(state.period==='past')return rs.filter(r=>r.plannedDate&&r.plannedDate<ASOF&&!complete(r));const w=state.period==='next7'?{start:add(ASOF,1),end:add(ASOF,7)}:week(({last:-1,this:0,next:1})[state.period]??0);return rs.filter(r=>inside(r.plannedDate,w))}
const searchRows=rs=>rs.filter(r=>!state.search||`${r.supplier} ${r.owner} ${r.category} ${r.substream}`.includes(state.search.trim()));
function pmoPanel(){const rs=DATA.actions.filter(a=>!['已完成','按时完成','延期完成'].includes(a.status)),done=DATA.actions.length-rs.length;return `<details class="panel section" id="pmoDetails"><summary>配套行动事项 · ${rs.length} 项进行中或状态待补</summary><p class="panel-note">全表共 ${DATA.actions.length} 项，${done} 项标记完成。下方是全采购配套事项，不随供应商筛选，不计入供应商完成数。</p><div class="table-scroll section" tabindex="0" role="region" aria-label="配套行动表"><table style="min-width:1200px"><thead><tr><th>事项</th><th>负责人</th><th>原计划日</th><th>当前状态</th><th>最新记录</th></tr></thead><tbody>${rs.map(a=>`<tr><td>${esc(a.description)}${sub(esc(a.locator))}</td><td>${esc(a.owner||'未填')}</td><td>${dateLong(a.plannedDate)}</td><td>${esc(a.status||'未填')}</td><td>${esc(a.updates.length?a.updates.at(-1).text:'暂无记录')}</td></tr>`).join('')}</tbody></table></div></details>`}
function planView(rs){const list=searchRows(periodRows(rs)).sort(dateSort),m=stats(list);return `${weekCards(rs)}${section('下一步，从供应商开始','排期来自“目标完成时间”，不是约谈日；未填日期的供应商在“待排期”。',`<div class="tab-toolbar"><div class="segmented" aria-label="任务期间">${['today','this','next','next7','past','unscheduled','all'].map(p=>`<button data-plan-filter="${p}" class="${state.period===p?'active':''}">${periodLabels[p]}</button>`).join('')}</div><input class="search-box" id="planSearch" type="search" aria-label="搜索工作计划" placeholder="搜索供应商、负责人或品类" value="${esc(state.search)}"></div><div class="section-head"><p>${periodLabels[state.period]} · ${m.n} 家 · ${m.n?`已填目标 ${money(m.target)} 万元；目标待补 ${m.n-m.targetFilled} 家`:'无到期记录'}</p><button class="ghost" data-export="plan">导出当前任务 CSV ↓</button></div>${supplierTable(list)}`)}${notice(state.period==='next7'?`未来七天为 ${dateLong(add(ASOF,1))} 至 ${dateLong(add(ASOF,7))}；不含快照当日，不同于下周一至周日。`:`已填完成日期的供应商仍展示在原排期中，并明确标记完成；缺日期、缺金额均保留为待补。`)}${pmoPanel()}`}
function ledgerRows(rs){let list=searchRows(rs);if(state.status==='completed')list=list.filter(complete);if(state.status==='missing')list=list.filter(r=>!r.actualDate||!num(r.actualAmount));if(state.status==='unscheduled')list=list.filter(r=>!r.plannedDate);if(state.status==='today')list=list.filter(r=>r.plannedDate===ASOF);return list.sort(state.sort==='amount'?(a,b)=>(b.targetAmount??-1)-(a.targetAmount??-1):state.sort==='owner'?(a,b)=>a.owner.localeCompare(b.owner,'zh-CN')||dateSort(a,b):dateSort)}
function suppliersView(rs){const list=ledgerRows(rs),pages=Math.max(1,Math.ceil(list.length/15));state.page=Math.min(state.page,pages);const m=stats(list);return `<div class="tab-toolbar"><div class="segmented" aria-label="明细状态">${[['all','全部记录'],['today','今日到期'],['unscheduled','待排期'],['missing','待回填实际'],['completed','已填完成日']].map(([v,t])=>`<button data-status="${v}" class="${state.status===v?'active':''}">${t}</button>`).join('')}</div><input class="search-box" id="supplierSearch" type="search" aria-label="搜索供应商明细" placeholder="搜索供应商、负责人或品类" value="${esc(state.search)}"></div><div class="section-head"><p>${m.n} 家 · 已填目标 ${money(m.target)} 万元 · ${m.n-m.targetFilled} 家目标待补</p><div class="ledger-actions"><select id="sortSelect" aria-label="明细排序"><option value="date" ${state.sort==='date'?'selected':''}>按目标完成日</option><option value="amount" ${state.sort==='amount'?'selected':''}>按目标金额</option><option value="owner" ${state.sort==='owner'?'selected':''}>按负责人</option></select><button class="ghost" data-export="suppliers">导出筛选结果 ↓</button></div></div>${supplierTable(list.slice((state.page-1)*15,state.page*15))}<div class="pagination"><span>显示 ${list.length?(state.page-1)*15+1:0}–${Math.min(state.page*15,list.length)} / ${list.length} 家</span><div><button data-page="-1" ${state.page===1?'disabled':''} aria-label="上一页">←</button><span>${state.page} / ${pages}</span><button data-page="1" ${state.page===pages?'disabled':''} aria-label="下一页">→</button></div></div>${notice('分类取自新文件“采购5921清单”的分类列。各分类分表仅用于核对，不再重复加总。')}`}
function render(){const rs=base(),titles={overview:['采购降本，进展一目了然。','部门目标、负责人安排与实际进度，一处查看。'],owners:['每个人的目标与进度。','查看目标、完成记录、待补金额和接下来的任务。'],plan:['接下来，推进哪些供应商。','区分已排期、已填完成日和待排期任务。'],suppliers:['供应商明细，一查到底。','按负责人、采购分类、供应商或品类筛选。']};document.querySelectorAll('.nav [data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('pageTitle').textContent=titles[state.view][0];$('pageDesc').textContent=titles[state.view][1];$('scopeLabel').textContent=`${state.owner==='all'?'全部负责人':state.owner} · ${rs.length} 家已登记`;$('app').innerHTML=({overview,owners:ownersView,plan:planView,suppliers:suppliersView}[state.view])(rs);for(const id of ['planSearch','supplierSearch']){if($(id))$(id).addEventListener('input',e=>{const pos=e.target.selectionStart;state.search=e.target.value;state.page=1;render();$(id).focus();$(id).setSelectionRange(pos,pos)})}if($('sortSelect'))$('sortSelect').onchange=e=>{state.sort=e.target.value;state.page=1;render()}}
function detail(id){const r=DATA.records.find(r=>r.id===id);if(!r)return;$('detailTitle').textContent=r.supplier;const fields=[['分类',r.substream],['品类',r.category],['负责人',r.owner],['目标金额',num(r.targetAmount)?money(r.targetAmount)+' 万元':'待补'],['目标完成日',r.plannedDate?dateLong(r.plannedDate):'待排期'],['实际完成日',dateLong(r.actualDate)],['实际返利',num(r.actualAmount)?money(r.actualAmount)+' 万元':'未填'],['目标返利率',num(r.targetRebateRate)?pct(r.targetRebateRate,1):'待补'],['年度金额',money(r.annualReceiptAmount)+' 万元'],['年度期间',META.annualReceiptPeriod]];const clues=[['历史降价比',r.historicalPriceReductionRate],['历史涨价金额',r.historicalPriceIncreaseAmount],['份额占比（原表分母待确认）',r.shareOfSupplierSales],['企业类型',r.companyType],['可替代性',r.substitutability],['合作年限（按汇总表原值）',r.relationshipYears],['得邦相似业务',r.debongSimilarBusiness],['交付问题',r.deliveryIssue],['质量问题',r.qualityIssue]];$('detailBody').innerHTML=`${chip(...status(r))}<div class="details-grid section">${fields.map(([k,v])=>`<div><label>${esc(k)}</label><b>${esc(v)}</b></div>`).join('')}</div><h3>谈判准备线索</h3><p>以下按汇总表原值显示；不改写不明确的数值口径。</p><div class="note-box">${clues.map(([k,v])=>`${esc(k)}：${v===null||v===undefined?'未填':esc(v)}`).join('\n')}</div><h3>成果口径</h3><p>完成日期不等于返利金额或财务兑现。约谈记录、财务确认与到账凭证尚无独立字段。</p><div class="source-box">${esc(META.sourceFile)}<br>${esc(r.locator)}<br>目标 F${r.sourceRow} · 责任人 H${r.sourceRow} · 目标日期 I${r.sourceRow} · 实际日期/金额 J${r.sourceRow}:K${r.sourceRow}</div>`;$('detailDialog').showModal()}
function methods(){const S=DATA.summary;return `<h3>本次更新</h3><p>主表为“${esc(META.primarySheet)}”，共 ${S.supplierCount} 家供应商、${S.owners.length} 位负责人。已填目标 ${S.targetFilled} 家，合计 ${money(S.targetAmount)} 万元；实际完成日期已填 ${S.actualDateFilled} 家，实际返利金额已填 ${S.actualAmountFilled} 家。</p><h3>目标层级</h3><p>已分解目标只汇总供应商级金额。模具表汇总参考 ${money(S.moldReferenceAmount)} 万元，公式 ${esc(S.moldReferenceFormula)}，不分摊、不计入供应商目标。原列标题 5,000 万与工作表名称“5921”均需业务确认，不能直接作为完整部门批准目标。</p><h3>时间与成果</h3><ul><li>目标完成日取 I 列，不等于谈判预约日；周一至周日归集。</li><li>实际完成日取 J 列，实际返利金额取 K 列，两者分别计数。</li><li>有日期样本按时率 = 实际完成日不晚于目标日的已完成记录 / 同时有两日期的已完成记录；附样本数量，不外推全体。</li><li>空白金额不当作零，目标达成率在实际金额完整前不可计算。</li><li>已谈数量、签约、财务确认与到账/抵扣需要独立记录；当前不能从完成日期推断。</li><li>切换周仅改变计划窗口，不重建历史快照。</li><li>待排期记录不落入任一周，也不自动视为逾期。</li></ul><h3>来源差异与缺失</h3><ul>${DATA.issues.map(i=>`<li><strong>${esc(i.title)}</strong><br>${esc(i.detail)}<br>${esc(i.locator)}</li>`).join('')}</ul><h3>更新与维护</h3><p>本页面是原始 Excel 的离线快照，未实现自动同步或源表写回。各分类分表只做交叉核对，避免与汇总表重复计算。PMO 行动单独管理。</p><h3>显示设置</h3><p>本版所有文字最小 21px，表格可在局部横向滚动；手机保持相同最小字号。</p><div class="source-box">来源：${esc(META.sourceFile)}<br>主表：${esc(META.primarySheet)}!${esc(META.rowRange)}<br>快照日：${esc(ASOF)} · 金额：人民币元换算万元<br>文件版本：${esc(META.sourceModified)}<br>SHA-256：${esc(META.sourceSha256)}</div>`}
function exportCsv(kind){const rs=kind==='plan'?searchRows(periodRows(base())).sort(dateSort):ledgerRows(base());const safe=v=>{let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"'};const rows=[['供应商','分类','负责人','目标金额（万元）','目标完成日','实际完成日','实际返利（万元）','来源','快照日'],...rs.map(r=>[r.supplier,r.substream,r.owner,num(r.targetAmount)?r.targetAmount/10000:null,r.plannedDate,r.actualDate,num(r.actualAmount)?r.actualAmount/10000:null,r.locator,ASOF])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`采购任务_${ASOF}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('toast').textContent=`已导出 ${rs.length} 条记录，空白金额保持为空。`;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close){$(b.dataset.close).close();return}if(b.hasAttribute('data-method')){$('methodDialog').showModal();return}if(b.dataset.record){detail(b.dataset.record);return}if(b.dataset.export){exportCsv(b.dataset.export);return}let top=false;if(b.dataset.view){state.view=b.dataset.view;state.search='';state.page=1;top=true}if(b.dataset.owner){state.owner=b.dataset.owner;$('ownerFilter').value=state.owner;state.view='owners';state.search='';top=true}if(b.dataset.period){state.period=b.dataset.period;state.view='plan';state.search='';top=true}if(b.dataset.planFilter)state.period=b.dataset.planFilter;if(b.dataset.status){state.status=b.dataset.status;state.page=1}if(b.dataset.page)state.page+=Number(b.dataset.page);if(b.dataset.view||b.dataset.owner||b.dataset.period||b.dataset.planFilter||b.dataset.status||b.dataset.page){render();if(top)window.scrollTo({top:0,behavior:'instant'})}});
for(const name of ['non-BOM 模具','non-BOM 工装','non-BOM 物流']){const o=document.createElement('option');o.value=o.textContent=name;$('workstreamFilter').append(o)}
for(const name of [...new Set(DATA.records.map(r=>r.owner))].sort((a,b)=>a.localeCompare(b,'zh-CN'))){const o=document.createElement('option');o.value=o.textContent=name;$('ownerFilter').append(o)}
$('workstreamFilter').onchange=e=>{state.workstream=e.target.value;state.page=1;render()};$('ownerFilter').onchange=e=>{state.owner=e.target.value;state.page=1;render()};$('weekAnchor').value=ASOF;$('weekAnchor').onchange=e=>{if(e.target.value){state.week=e.target.value;render()}};
$('resetBtn').onclick=()=>{Object.assign(state,{workstream:'all',owner:'all',week:ASOF,period:'this',search:'',status:'all',page:1,sort:'date'});$('workstreamFilter').value='all';$('ownerFilter').value='all';$('weekAnchor').value=ASOF;render()};
$('methodBtn').onclick=()=>$('methodDialog').showModal();$('methodBody').innerHTML=methods();$('asofLabel').textContent=dateLong(ASOF);$('sourceFooter').textContent=`来源：${META.sourceFile} · ${META.primarySheet}第 2–158 行`;
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}}));
render();
</script>
</body></html>
