<script>'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent);
const META=DATA.metadata, ASOF=META.asOf;
const state={view:'overview',workstream:'all',owner:'all',week:ASOF,period:'this',search:'',status:'all',page:1,sort:'date',pmo:false};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=x=>x!==null&&x!==undefined&&x!=='';
const num=x=>Number.isFinite(Number(x))&&has(x);
const money=x=>num(x)?(Number(x)/10000).toLocaleString('zh-CN',{maximumFractionDigits:1}):'待回填';
const fmt=x=>Number(x).toLocaleString('zh-CN',{maximumFractionDigits:1});
const pct=(x,y)=>y?`${(100*x/y).toFixed(1)}%`:'—';
const sum=(rows,key)=>{const a=rows.filter(r=>num(r[key]));return a.length?a.reduce((s,r)=>s+Number(r[key]),0):null};
const d=x=>new Date(`${String(x).slice(0,10)}T12:00:00Z`);
const iso=x=>x.toISOString().slice(0,10);
const add=(x,n)=>{let z=d(x);z.setUTCDate(z.getUTCDate()+n);return iso(z)};
const monday=x=>add(x,-((d(x).getUTCDay()+6)%7));
const md=x=>x?`${Number(x.slice(5,7))}/${Number(x.slice(8,10))}`:'未填';
const dateLong=x=>x?`${x.slice(0,4)}.${x.slice(5,7)}.${x.slice(8,10)}`:'未填';
const windowFor=(n=0)=>{let start=add(monday(state.week),n*7);return {start,end:add(start,6)}};
const between=(x,w)=>Boolean(x&&x>=w.start&&x<=w.end);
const weekLabel=w=>`${md(w.start)} – ${md(w.end)}`;
const base=()=>DATA.records.filter(r=>(state.workstream==='all'||r.workstream===state.workstream)&&(state.owner==='all'||r.owner===state.owner));
const recordedComplete=r=>Boolean(r.actualDate&&r.actualDate<=ASOF);
const statusOf=r=>recordedComplete(r)?{text:'已回填完成日',cls:'green'}:r.actualDate&&r.actualDate>ASOF?{text:'完成日期晚于快照',cls:'amber'}:r.plannedDate<ASOF?{text:'已过截止日 · 待确认',cls:'amber'}:r.plannedDate===ASOF?{text:'今日到期 · 待确认',cls:'amber'}:{text:'已排期 · 待回填',cls:'outline'};
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;
const small=(t)=>`<div class="cell-sub">${t}</div>`;
function supplierMetrics(rows){const complete=rows.filter(recordedComplete),actual=rows.filter(r=>num(r.actualAmount));return {n:rows.length,target:sum(rows,'targetAmount'),completed:complete.length,actualCount:actual.length,actual:sum(actual,'actualAmount'),onTime:complete.filter(r=>r.plannedDate&&r.actualDate<=r.plannedDate).length,eligible:complete.filter(r=>r.plannedDate).length,today:rows.filter(r=>r.plannedDate===ASOF&&!recordedComplete(r)),past:rows.filter(r=>r.plannedDate<ASOF&&!recordedComplete(r)),fill:rows.filter(r=>has(r.actualDate)||num(r.actualAmount)).length}}
function kpi(label,value,unit,foot,cls='',track=null){return `<article class="kpi ${cls}"><div class="label">${label}</div><div class="value">${value}${unit?`<small>${unit}</small>`:''}</div>${track!==null?`<div class="track"><i style="width:${Math.max(0,Math.min(track,100))}%"></i></div>`:''}<div class="foot">${foot}</div></article>`}
function notice(text){return `<div class="notice"><span class="index">i</span><div>${text}</div></div>`}
function section(title,desc,content,action=''){return `<section class="section"><div class="section-head"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${action}</div>${content}</section>`}
function noCoverage(){return `<div class="panel"><p class="eyebrow">NON-BOM · AWAITING SOURCE</p><h2>non-BOM 明细尚未回传</h2><p class="panel-note">当前工作簿记录了 non-BOM 团队参与和模板发送事项，但尚无可汇总的供应商、责任人、目标金额或完成记录。</p><div class="mini-kpis section">${['供应商数','目标金额','实际完成','下周计划'].map(t=>`<div class="mini-kpi"><label>${t}</label><b style="font-size:20px">暂无数据</b></div>`).join('')}</div><button class="ghost" data-method>查看待补字段</button></div>${notice('全部采购视图目前仅能汇总 <strong>BOM 已登记明细</strong>。non-BOM 不计为 0，也不与 BOM 混作部门完整口径。')}`}
function stagePanel(rows){let m=supplierMetrics(rows);return `<div class="panel"><div class="panel-top"><div><h3>成果与时间，两条线看</h3><p>成果需要实际字段；按时率需要完成日期。</p></div>${chip('实际待补','amber')}</div><div class="action-list"><div class="action-row"><div class="action-num">—</div><div class="action-copy"><strong>已谈供应商 / 上周已谈</strong><p>缺少谈判发生日期与谈判记录</p></div></div><div class="action-row"><div class="action-num ${m.actualCount?'positive':''}">${m.actualCount?money(m.actual):'—'}</div><div class="action-copy"><strong>表内实际返利 · ${m.actualCount} / ${m.n} 家已填</strong><p>${m.actualCount?`已填金额合计 ${money(m.actual)} 万元`:'实际金额空白，目标达成率暂不可计算'}</p></div></div><div class="action-row"><div class="action-num">${m.eligible?pct(m.onTime,m.eligible):'—'}</div><div class="action-copy"><strong>按时完成率</strong><p>${m.eligible?`${m.onTime} / ${m.eligible} 家有完整计划与完成日期`:'无实际完成日期，无法判断是否按时'}</p></div></div><div class="action-row"><div class="action-num">—</div><div class="action-copy"><strong>财务确认 / 实际兑现</strong><p>尚无独立金额、日期及凭证字段</p></div></div></div></div>`}
function allocationPanel(rows){const m=supplierMetrics(rows),all=state.owner==='all',ref=DATA.summary.headerTargetAmount;return `<div class="panel"><div class="panel-top"><div><h3>${all?'目标分解进展':'个人目标分解'}</h3><p>${all?'原列标题与清单明细分别展示，待业务确认目标口径。':'责任人名下所有供应商目标，按原清单汇总。'}</p></div>${chip('BOM')}</div><div class="metric-inline"><div><div class="big">${money(m.target)}<small>万元</small></div><div class="small">已分解到供应商</div></div><div><div class="big">${m.n}<small>家</small></div><div class="small">已登记供应商</div></div><div><div class="big">${all?money(ref-m.target):DATA.records.filter(r=>r.owner===state.owner).length}<small>${all?'万元':'家'}</small></div><div class="small">${all?'与原表标题目标的差额':'本人负责'}</div></div></div><div class="bar-rows">${all?`<div><div class="bar-label"><span>原列标题目标 · 待确认</span><b>${money(ref)} 万元</b></div><div class="bar"><i style="width:100%"></i></div></div>`:''}<div><div class="bar-label"><span>清单目标合计</span><b>${money(m.target)} 万元${all?` · ${pct(m.target,ref)}`:''}</b></div><div class="bar green"><i style="width:${all?Math.min(100,m.target/ref*100):100}%"></i></div></div></div><p class="panel-note">${all?`${money(m.target)} 万元是已分解目标，${pct(m.target,ref)} 是目标分解覆盖率。两者均不代表降本成果或目标达成。`:'个人目标占当前 BOM 清单 '+pct(m.target,DATA.summary.targetAmount)+'；完成与兑现仍以实际记录为准。'}</p></div>`}
function weekCards(rows){return `<div class="weeks">${[-1,0,1].map(n=>{let w=windowFor(n),rs=rows.filter(r=>between(r.plannedDate,w)),c=rows.filter(r=>between(r.actualDate,w)&&r.actualDate<=ASOF),labels={[-1]:'上周',[0]:'本周',[1]:'下周'},actualCoverage=rows.some(r=>has(r.actualDate));return `<article class="week-card ${n===0?'current':''}"><div class="week-head"><h3>${labels[n]}</h3>${chip(weekLabel(w),n===0?'green':'outline')}</div><div class="numbers"><b>${rs.length}</b><span>家按目标完成日到期</span></div><div class="small">对应目标 <strong>${rs.length?money(sum(rs,'targetAmount')):'0'}</strong> 万元</div><div class="week-facts"><span>实际完成记录</span><b>${actualCoverage?`${c.length} 家（已回填）`:'待回填'}</b></div><div class="week-facts"><span>${n===-1?'已谈数量':'约谈安排'}</span><b>未记录</b></div><button class="textbtn" data-period="${n===-1?'last':n===0?'this':'next'}">查看${labels[n]}供应商 →</button></article>`}).join('')}</div>`}
function planChart(rows){const points=[...new Set(rows.map(r=>r.plannedDate).filter(Boolean))].sort();if(!points.length)return '<div class="empty">当前范围无排期记录</div>';const amounts=points.map(date=>sum(rows.filter(r=>r.plannedDate===date),'targetAmount')/10000),max=Math.max(...amounts,1);let width=840,height=205,left=34,right=12,top=20,bottom=40,pw=width-left-right,ph=height-top-bottom,cell=pw/points.length;return `<svg class="timeline-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="按目标完成日期归集的目标金额，单位万元">${[0,.5,1].map(t=>`<line x1="${left}" y1="${top+ph*(1-t)}" x2="${width-right}" y2="${top+ph*(1-t)}" stroke="#28302a"/><text x="${left-7}" y="${top+ph*(1-t)+4}" fill="#9da39e" text-anchor="end" font-size="10">${Math.round(max*t)}</text>`).join('')}${points.map((date,i)=>{let h=amounts[i]/max*ph,x=left+i*cell+cell*.22;return `<g><title>${date}：${fmt(amounts[i])} 万元，${rows.filter(r=>r.plannedDate===date).length} 家</title><rect x="${x}" y="${top+ph-h}" width="${cell*.56}" height="${h}" rx="3" fill="${date===ASOF?'#56d15f':'#586b5c'}"/><text x="${left+i*cell+cell/2}" y="${top+ph+21}" text-anchor="middle" fill="#a8b2a9" font-size="11">${md(date)}</text><text x="${left+i*cell+cell/2}" y="${top+ph-h-6}" text-anchor="middle" fill="#d5ddd5" font-size="11">${fmt(amounts[i])}</text></g>`}).join('')}</svg><div class="mobile-chart" role="img" aria-label="每日目标金额，单位万元">${points.map((date,i)=>`<div><div class="bar-label"><span>${md(date)} · ${rows.filter(r=>r.plannedDate===date).length} 家</span><b>${fmt(amounts[i])} 万元</b></div><div class="bar ${date===ASOF?'green':''}"><i style="width:${amounts[i]/max*100}%"></i></div></div>`).join('')}</div>`}
function categoryCards(rows){const m=supplierMetrics(rows);return `<div class="workstream-block"><div class="panel category-card"><div class="panel-top"><h3>BOM</h3>${chip('供应商明细已登记','green')}</div><div class="category-main"><b>${money(m.target)}</b><span>万元已分解目标</span></div><div class="track"><i style="width:100%;background:#596e5d"></i></div><div class="category-metrics"><div><small>供应商</small><b>${m.n} 家</b></div><div><small>实际金额回填</small><b>${m.actualCount} / ${m.n} 家</b></div><div><small>实际兑现</small><b>待建立口径</b></div></div></div><div class="panel category-card"><div class="panel-top"><h3>non-BOM</h3>${chip('供应商明细待回传','amber')}</div><div class="category-main"><b style="font-size:25px;color:var(--muted)">暂无明细</b></div><p class="subtle">团队已纳入日清日结，模板已发送；目标与成果暂不能进入采购合计。</p><div class="category-metrics"><div><small>供应商</small><b>待提供</b></div><div><small>目标金额</small><b>待提供</b></div><div><small>负责人分配</small><b>待提供</b></div></div></div></div>`}
function ownerTable(rows){let groups=[...new Set(rows.map(r=>r.owner))].map(o=>{let rs=rows.filter(r=>r.owner===o);return {owner:o,rs,m:supplierMetrics(rs)}}).sort((a,b)=>b.m.target-a.m.target);return `<div class="panel table-panel"><div class="table-scroll" role="region" aria-label="负责人进度表，可横向滚动" tabindex="0"><table style="min-width:1250px"><thead><tr><th>负责人</th><th class="num">供应商</th><th class="num">累计目标 / 万元</th><th class="num">累计已谈</th><th class="num">实际返利 / 万元</th><th class="num">目标达成率</th><th class="num">完成日已填</th><th class="num">上周已谈</th><th class="num">本周到期</th><th class="num">下周到期</th><th>关注事项</th></tr></thead><tbody>${groups.map(({owner,rs,m})=>{let cur=rs.filter(r=>between(r.plannedDate,windowFor(0))),next=rs.filter(r=>between(r.plannedDate,windowFor(1)));return `<tr><td><div class="owner-cell"><span class="avatar">${esc(owner.slice(-1))}</span><button data-owner="${esc(owner)}"><strong>${esc(owner)}</strong>${small('查看个人工作台 →')}</button></div></td><td class="num">${m.n}</td><td class="num"><strong>${money(m.target)}</strong>${small(`占清单 ${pct(m.target,DATA.summary.targetAmount)}`)}</td><td class="num">待记录</td><td class="num">${m.actualCount?money(m.actual):'待回填'}${small(`${m.actualCount} / ${m.n} 家已填`)}</td><td class="num">${m.actualCount===m.n&&m.n?pct(m.actual,m.target):'待回填'}</td><td class="num">${m.completed} / ${m.n}</td><td class="num">待记录</td><td class="num"><strong>${cur.length} 家</strong>${small(`${cur.length?money(sum(cur,'targetAmount')):0} 万元`)}</td><td class="num"><strong>${next.length} 家</strong>${small(`${next.length?money(sum(next,'targetAmount')):0} 万元`)}</td><td>${m.today.length?chip(`今日到期 ${m.today.length} 家`,'amber'):m.past.length?chip(`已过截止 ${m.past.length} 家`,'amber'):chip('跟进结果回填','outline')}</td></tr>`}).join('')}</tbody></table></div><div class="table-footer"><span>金额按责任人汇总；不按缺失的成果做排名。按时率需同时具备目标与实际完成日。</span><span>点击姓名进入个人工作台</span></div></div>`}
function overview(rows){let m=supplierMetrics(rows);return `<div class="kpis">${kpi('已分解目标 · 当前 BOM 清单',money(m.target),'万元',`${m.n} 家供应商 · ${new Set(rows.map(r=>r.owner)).size} 位负责人`,'accent')}${kpi('本周到期目标',money(sum(rows.filter(r=>between(r.plannedDate,windowFor(0))),'targetAmount')??0),'万元',`${rows.filter(r=>between(r.plannedDate,windowFor(0))).length} 家 · ${weekLabel(windowFor(0))}`)}${kpi('表内实际返利',m.actualCount?money(m.actual):'待回填',m.actualCount?'万元':'',`${m.actualCount} / ${m.n} 家已填金额 · 目标达成率待确认`)}${kpi('今日到期 · 完成情况待确认',m.today.length,'家',`对应目标 ${money(sum(m.today,'targetAmount')??0)} 万元 · ${md(ASOF)}`)}</div>${notice('<strong>当前仅覆盖 BOM 供应商明细。</strong> 实际完成日期与金额均未回填，non-BOM 明细待提供；空白不视为零成果。表内实际返利也需与财务兑现分别确认。')}<div class="section grid2">${allocationPanel(rows)}${stagePanel(rows)}</div>${section('周节奏','按目标完成日期归集。实际谈判次数与约谈日尚未记录。',weekCards(rows))}${section('负责人进度','同时看任务规模、目标金额与近期到期安排。',ownerTable(rows),'<button class="ghost" data-view="owners">展开负责人视图 →</button>')}${section('采购范围覆盖','BOM 与 non-BOM 分开呈现，待明细齐备后再形成部门完整合计。',categoryCards(rows))}${section('每日目标排期','供应商目标完成日对应的目标金额，单位万元；这是计划分布。',`<div class="grid2"><div class="panel"><div class="panel-top"><h3>目标完成日分布</h3>${chip('计划金额','outline')}</div>${planChart(rows)}</div><div class="panel"><div class="panel-top"><div><h3>全表数据待核对</h3><p>以下问题不随负责人筛选</p></div>${chip('3 项待核对','amber')}</div><div class="action-list"><div class="action-row"><div class="action-num warning">280</div><div class="action-copy"><strong>万元目标差额待确认</strong><p>原列标题 5,000 万；明细目标 4,720 万。</p></div></div><div class="action-row"><div class="action-num">72</div><div class="action-copy"><strong>家明细与文字 73 家不一致</strong><p>清单排名缺 32，需核对供应商名单。</p></div></div><div class="action-row"><div class="action-num">23</div><div class="action-copy"><strong>家“下周需谈判”的文字计划</strong><p>原任务未注明该句形成日期，暂不等同下周到期的 32 家。</p></div></div></div><button class="textbtn" data-method>查看来源与处理规则 →</button></div></div>`)}`}
function ownersView(rows){let m=supplierMetrics(rows),isPerson=state.owner!=='all';return `${isPerson?`<div class="person-banner"><span class="avatar">${esc(state.owner.slice(-1))}</span><div><h2>${esc(state.owner)}的工作台</h2><p>BOM · ${m.n} 家供应商 · 当前目标 ${money(m.target)} 万元</p></div></div>`:''}<div class="mini-kpis"><div class="mini-kpi"><label>累计分解目标</label><b>${money(m.target)}</b><small>万元</small><p>全部已登记供应商</p></div><div class="mini-kpi"><label>累计已谈 / 实际完成</label><b style="font-size:22px">待回填</b><p>${m.completed} / ${m.n} 家填写完成日</p></div><div class="mini-kpi"><label>表内实际返利</label><b>${m.actualCount?money(m.actual):'待回填'}</b><p>${m.actualCount} / ${m.n} 家填写金额</p></div><div class="mini-kpi"><label>按时完成率</label><b>${m.eligible?pct(m.onTime,m.eligible):'暂不可算'}</b><p>已完成且计划日、完成日齐备样本 ${m.eligible} 家</p></div></div>${isPerson?weekCards(rows):ownerTable(rows)}${notice('<strong>“完成日已填”是数据记录数。</strong> 当前不能据此判断未填的供应商尚未谈判，也不能将“已谈、谈定、签约、已兑现”合并成同一完成状态。')}${isPerson?section('近期供应商任务','优先关注今日到期与最近截止日，点击供应商查看谈判线索。',supplierTable(rows.slice().sort(dateSort).slice(0,12)),`<button class="ghost" data-view="plan">查看全部工作计划 →</button>`):section('上周、本周与下周','选择上方责任人，或点击姓名，查看个人工作台。',weekCards(rows))}${section('成果认定与进度', '目标、实际返利、按时完成、兑现分别跟进。', `<div class="grid2">${allocationPanel(rows)}${stagePanel(rows)}</div>`)}`}
function dateSort(a,b){return (a.plannedDate||'9999').localeCompare(b.plannedDate||'9999')||Number(b.targetAmount)-Number(a.targetAmount)}
function periodRows(rows){if(state.period==='all')return rows;if(state.period==='today')return rows.filter(r=>r.plannedDate===ASOF);if(state.period==='past')return rows.filter(r=>r.plannedDate<ASOF&&!recordedComplete(r));if(state.period==='next7')return rows.filter(r=>between(r.plannedDate,{start:add(ASOF,1),end:add(ASOF,7)}));let off={last:-1,this:0,next:1}[state.period]??0;return rows.filter(r=>between(r.plannedDate,windowFor(off)))}
function supplierTable(rows){return `<div class="panel table-panel"><div class="table-scroll" role="region" aria-label="供应商明细表，可横向滚动" tabindex="0"><table style="min-width:1120px"><thead><tr><th>供应商 / 品类</th><th>负责人</th><th class="num">目标 / 万元</th><th class="num">目标返利率</th><th>目标完成日</th><th>实际完成日</th><th class="num">实际返利 / 万元</th><th>进度记录</th><th>来源</th></tr></thead><tbody>${rows.length?rows.map(r=>{let s=statusOf(r);return `<tr><td><button class="row-action" data-record="${esc(r.id)}"><strong>${esc(r.supplier)}</strong></button>${small(`${esc(r.workstream)} · ${esc(r.category||'未分类')}`)}</td><td>${esc(r.owner)}</td><td class="num"><strong>${money(r.targetAmount)}</strong></td><td class="num">${num(r.targetRebateRate)?`${(r.targetRebateRate*100).toFixed(1)}%`:'未填'}</td><td>${dateLong(r.plannedDate)}</td><td>${r.actualDate?dateLong(r.actualDate):'<span class="subtle">未填</span>'}</td><td class="num">${num(r.actualAmount)?money(r.actualAmount):'<span class="subtle">未填</span>'}</td><td>${chip(s.text,s.cls)}</td><td><button class="textbtn" data-record="${esc(r.id)}">第 ${r.sourceRow} 行 ↗</button></td></tr>`}).join(''):'<tr><td colspan="9"><div class="empty">当前筛选下没有供应商记录。可切换期间、责任人或采购范围。</div></td></tr>'}</tbody></table></div></div>`}
function pmoPanel(){const actions=DATA.actions.filter(a=>a.status==='进行中');return `<details class="panel section" id="pmoDetails"><summary style="cursor:pointer"><strong>配套行动事项</strong> <span class="subtle">4 项进行中 · 与供应商谈判分开管理</span></summary><p class="panel-note">原行动表共 21 项，17 项标记完成。6 项同时有计划日与完成日，其中 5 项按时、1 项延期；另外 11 项已完成但缺日期。以下为全部采购的跨部门配套事项，不随供应商筛选。</p><div class="table-scroll section" role="region" aria-label="配套行动事项表" tabindex="0"><table style="min-width:700px"><thead><tr><th>行动事项</th><th>负责人</th><th>原计划日</th><th>最新记录</th></tr></thead><tbody>${actions.map(a=>`<tr><td style="min-width:230px;max-width:390px">${esc(a.description)}${small(esc(a.locator))}</td><td>${esc(a.owner||'未填')}</td><td>${esc(a.plannedDate?md(a.plannedDate):'未填')}</td><td style="min-width:240px;max-width:450px">${esc(a.updates.length?a.updates[a.updates.length-1].text:'暂无更新')}</td></tr>`).join('')}</tbody></table></div></details>`}
function planView(rows){const list=periodRows(rows).filter(r=>!state.search||`${r.supplier} ${r.category} ${r.owner}`.includes(state.search)).sort(dateSort),total=sum(list,'targetAmount'),labels={last:'上周到期',this:'本周到期',next:'下周到期',today:'今日到期',past:'已过截止日',next7:'未来 7 天',all:'全部排期'};return `${weekCards(rows)}${section('下一步，从供应商开始','排期来自“目标完成时间”，不是约谈日；与当前实际进度分别查看。',`<div class="tab-toolbar"><div class="segmented" aria-label="任务期间">${['today','this','next','next7','past','all'].map(p=>`<button data-plan-filter="${p}" class="${state.period===p?'active':''}">${labels[p]}</button>`).join('')}</div><input id="planSearch" class="search-box" type="search" placeholder="搜索供应商、负责人或品类" aria-label="搜索工作计划" value="${esc(state.search)}"></div><div class="section-head"><p>${labels[state.period]} · <strong>${list.length} 家</strong> · 对应目标 <strong>${list.length?money(total):'0'} 万元</strong></p><button class="ghost" data-export="plan">导出当前任务 CSV ↓</button></div>${supplierTable(list)}`)}${notice(state.period==='next7'?`<strong>未来 7 天：</strong>${dateLong(add(ASOF,1))} 至 ${dateLong(add(ASOF,7))}，不含快照当日；与“下周（周一至周日）”是不同时间窗。`:'<strong>行动建议：</strong>确认是否已谈 → 回填实际完成日期与返利金额 → 记录下次约谈和下一步动作 → 财务单独确认兑现。已过截止日且无完成记录的项目需先核实，不能直接认定业务逾期。')}${pmoPanel()}`}
function filteredLedger(rows){let rs=rows.filter(r=>!state.search||`${r.supplier} ${r.category} ${r.owner}`.includes(state.search));if(state.status==='missing')rs=rs.filter(r=>!has(r.actualDate)||!num(r.actualAmount));if(state.status==='today')rs=rs.filter(r=>r.plannedDate===ASOF&&!recordedComplete(r));if(state.status==='past')rs=rs.filter(r=>r.plannedDate<ASOF&&!recordedComplete(r));if(state.status==='completed')rs=rs.filter(recordedComplete);return rs.sort(state.sort==='amount'?(a,b)=>b.targetAmount-a.targetAmount:state.sort==='owner'?(a,b)=>a.owner.localeCompare(b.owner,'zh-CN')||dateSort(a,b):dateSort)}
function suppliersView(rows){const rs=filteredLedger(rows),pages=Math.max(1,Math.ceil(rs.length/15));state.page=Math.min(state.page,pages);let pageRows=rs.slice((state.page-1)*15,state.page*15);return `<div class="tab-toolbar"><div class="segmented" aria-label="明细状态">${[['all','全部记录'],['today','今日到期'],['past','已过截止日'],['missing','待回填实际'],['completed','已填完成日']].map(([v,t])=>`<button data-status="${v}" class="${state.status===v?'active':''}">${t}</button>`).join('')}</div><input id="supplierSearch" class="search-box" type="search" placeholder="搜索供应商、负责人或品类" aria-label="搜索供应商明细" value="${esc(state.search)}"></div><div class="section-head"><p><strong>${rs.length} 家</strong> · 目标合计 <strong>${rs.length?money(sum(rs,'targetAmount')):0} 万元</strong> · 点击名称查看详情</p><div style="display:flex;gap:10px;flex-wrap:wrap"><select id="sortSelect" aria-label="明细排序"><option value="date" ${state.sort==='date'?'selected':''}>按目标完成日</option><option value="amount" ${state.sort==='amount'?'selected':''}>按目标金额</option><option value="owner" ${state.sort==='owner'?'selected':''}>按负责人</option></select><button class="ghost" data-export="suppliers">导出筛选结果 ↓</button></div></div>${supplierTable(pageRows)}<div class="pagination"><span>显示 ${rs.length?(state.page-1)*15+1:0}–${Math.min(state.page*15,rs.length)} / ${rs.length} 家</span><div><button data-page="-1" ${state.page===1?'disabled':''} aria-label="上一页">←</button><span style="padding:8px">${state.page} / ${pages}</span><button data-page="1" ${state.page===pages?'disabled':''} aria-label="下一页">→</button></div></div>${notice('<strong>保留原始归类。</strong> 清单中的包材等供应商仍按来源工作表归入 BOM；未自行移入 non-BOM。金额单位为人民币万元，目标返利率取自原表。')}`}
function render(){let rows=base();document.querySelectorAll('.nav button').forEach(b=>{let active=b.dataset.view===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const titles={overview:['采购降本，进展一目了然。','目标分解到人，计划落到供应商，成果逐项确认。'],owners:['每个人的目标与进度。','把任务量、金额目标、历史成果与下一步工作放在同一张表上。'],plan:['接下来，推进哪些供应商。','按目标完成日组织本周、下周和未来 7 天的工作。'],suppliers:['供应商明细，一查到底。','从目标、负责人和截止日期，下钻到原表记录与谈判线索。']};$('pageTitle').textContent=titles[state.view][0];$('pageDesc').textContent=titles[state.view][1];$('scopeLabel').innerHTML=state.workstream==='non-BOM'?'non-BOM · <b>明细待回传</b>':`<b>${esc(state.owner==='all'?'全部负责人':state.owner)}</b> · ${rows.length} 家已登记`;if(state.workstream==='non-BOM')$('app').innerHTML=noCoverage();else $('app').innerHTML=({overview,owners:ownersView,plan:planView,suppliers:suppliersView}[state.view])(rows);bindLocal();}
function bindLocal(){for(const [id,key] of [['planSearch','search'],['supplierSearch','search']]){const e=$(id);if(e)e.addEventListener('input',()=>{state[key]=e.value;state.page=1;let pos=e.selectionStart;render();let n=$(id);n.focus();if(n.type==='search')n.setSelectionRange(pos,pos)})}if($('sortSelect'))$('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;state.page=1;render()})}
function openDetail(id){const r=DATA.records.find(x=>x.id===id);if(!r)return;$('detailTitle').textContent=r.supplier;const fields=[['采购范围 / 品类',`${r.workstream} / ${r.category||'未分类'}`],['责任人',r.owner],['目标返利',`${money(r.targetAmount)} 万元`],['目标返利率',num(r.targetRebateRate)?`${(r.targetRebateRate*100).toFixed(1)}%`:'未填'],['目标完成日期',dateLong(r.plannedDate)],['实际完成日期',r.actualDate?dateLong(r.actualDate):'未回填'],['表内实际返利',num(r.actualAmount)?`${money(r.actualAmount)} 万元`:'未回填'],['实际兑现', '未建立独立字段'],['年度入库金额',`${money(r.annualReceiptAmount)} 万元`],['年度入库期间',META.annualReceiptPeriod]];const clues=[['历史降价情况',r.historicalPriceReductionRate],['历史涨价情况',r.historicalPriceIncreaseAmount],['份额占比（原表口径待确认）',r.shareOfSupplierSales],['企业性质',r.companyType],['可替代性',r.substitutability],['合作年限',r.relationshipYears],['得邦相似业务',r.debongSimilarBusiness],['交付问题',r.deliveryIssue],['质量问题',r.qualityIssue]];$('detailBody').innerHTML=`<div style="margin-bottom:20px">${chip(statusOf(r).text,statusOf(r).cls)}</div><div class="details-grid">${fields.map(([k,v])=>`<div><label>${esc(k)}</label><b>${esc(v)}</b></div>`).join('')}</div><h3>谈判准备线索</h3><p>以下保留原表内容；数值口径未明确的字段按原始值显示。</p><div class="note-box">${clues.map(([k,v])=>`${esc(k)}：${has(v)?esc(v):'未填'}`).join('\n')}</div><h3>下一步信息</h3><p>本表未设置独立的约谈日、谈判日志、下次动作和财务兑现记录。当前详情提供已有事实与缺失提示。</p><div class="source-box">来源：${esc(META.sourceFile)}<br>${esc(r.locator)}<br>目标：E${r.sourceRow} · 负责人：G${r.sourceRow} · 目标完成日：H${r.sourceRow} · 实际日期/金额：I${r.sourceRow}:J${r.sourceRow}</div>`;$('detailDialog').showModal()}
function methodContent(){return `<h3>如何使用</h3><div class="method-grid"><div class="method-card"><b>部门管理</b><p>先看目标分解与本周到期，再看负责人分布；对缺失的实际进展发起确认。</p></div><div class="method-card"><b>个人工作台</b><p>选择负责人，查看本周与下周供应商，打开明细准备谈判，导出当前任务。</p></div></div><h3>核心指标口径</h3><ul><li><strong>已分解目标：</strong>供应商明细 E 列之和。目标分解覆盖率 = ${money(DATA.summary.targetAmount)} / 原表标题 ${money(DATA.summary.headerTargetAmount)} = ${pct(DATA.summary.targetAmount,DATA.summary.headerTargetAmount)}；不是降本达成率，也不证明目标已批准。</li><li><strong>本周 / 下周到期：</strong>按 H 列“目标完成时间”落入对应周的供应商数及目标金额。周一至周日；不是约谈次数。</li><li><strong>累计已谈 / 上周已谈：</strong>需要真实谈判日期和供应商 ID。本表无对应记录，暂不可计算。</li><li><strong>实际返利与达成率：</strong>以 J 列已填金额计算，完整覆盖后才显示总达成率。所有明细空白时不采用 J74 的合计零值。</li><li><strong>按时完成率：</strong>实际完成日 ≤ 目标完成日的供应商数 / 同时有目标日与实际完成日的已完成供应商数；必须附样本覆盖。</li><li><strong>真正实现：</strong>签约、财务确认、抵扣/到账分列；本表尚无独立字段和凭证，实际返利不能直接当作兑现。</li><li><strong>已过截止日待确认：</strong>目标完成日早于快照日且无有效完成记录；仅触发核实，不直接认定业务未完成。</li><li><strong>时间切换：</strong>基准日只改变周计划窗口。历史完成数据没有版本快照，不能重建过去某天的真实状态。</li></ul><h3>原表差异与缺失</h3><ul>${DATA.issues.map(x=>`<li><strong>${esc(x.title)}：</strong>${esc(x.detail)}<br><small>${esc(x.locator)}</small></li>`).join('')}</ul><h3>建议补齐的最小字段</h3><p>沿用 Excel 作为录入入口，增加以下字段后即可把计划看板升级为完整的成果看板。</p><div class="table-scroll section" role="region" aria-label="建议数据字段" tabindex="0"><table style="min-width:540px"><thead><tr><th>信息组</th><th>补充字段</th><th>支持的管理问题</th></tr></thead><tbody><tr><td>供应商主表</td><td>稳定 ID、BOM/non-BOM、负责人、目标版本、原始截止日</td><td>去重汇总、责任归属、按期基线</td></tr><tr><td>谈判记录</td><td>每次约谈计划日、实际谈判日、结果、下次动作和日期</td><td>累计谈了多少、上周谈了多少、下周要谈谁</td></tr><tr><td>成果与兑现</td><td>谈定金额/日期、签约金额/日期、财务确认、抵扣或到账金额/日期、凭证</td><td>目标达成、真正实现、避免重复计算</td></tr></tbody></table></div><h3>推荐运行节奏</h3><p>负责人每日更新实际进展与下次动作；日清日结先处理今日到期及已过截止日项目；每周固定一次计划基线，比较计划与实际；财务确认收益归属及兑现。</p><h3>本版更新方式</h3><p>这是嵌入真实工作簿数据的离线 HTML，可直接打开。筛选、搜索、导出均在本地运行。文件更新后需重新提取、核对字段与说明，再生成 HTML；未连接 Excel 自动同步，也不会写回原表。</p><div class="source-box">源文件：${esc(META.sourceFile)}<br>来源路径：${esc(META.sourcePath)}<br>工作表：${META.sheetNames.map(esc).join('、')}<br>快照日期：${esc(ASOF)} · 金额：人民币元转换为万元<br>年度入库期间：${esc(META.annualReceiptPeriod)}（原表 D1 批注）<br>SHA-256：${esc(META.sourceSha256)}<br>公式：读取原公式及保存缓存，独立汇总供应商目标；未重算或改写原件。<br>caseOS：本会话未提供可调用的 caseOS 工具，未完成本次图谱核验或新记录写入。本版依据原始 Excel。</div>`}
function exportCsv(type){let rs=type==='plan'?periodRows(base()).filter(r=>!state.search||`${r.supplier} ${r.category} ${r.owner}`.includes(state.search)).sort(dateSort):filteredLedger(base());const header=['供应商','采购范围','品类','负责人','目标金额（人民币万元）','目标完成日','实际完成日','表内实际返利（万元）','进度记录','来源定位','快照日期'];const cell=v=>{let t=String(v??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};const lines=[header,...rs.map(r=>[r.supplier,r.workstream,r.category,r.owner,num(r.targetAmount)?r.targetAmount/10000:'',r.plannedDate,r.actualDate,num(r.actualAmount)?r.actualAmount/10000:'',statusOf(r).text,r.locator,ASOF])].map(a=>a.map(cell).join(',')).join('\r\n');let blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`采购${type==='plan'?'任务':'明细'}_${state.owner==='all'?'全员':state.owner}_${ASOF}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`已导出 ${rs.length} 条记录；实际空白保留为空白。`)}
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close){$(b.dataset.close).close();return}if(b.hasAttribute('data-method')){$('methodDialog').showModal();return}if(b.dataset.view){state.view=b.dataset.view;state.search='';state.page=1;render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.owner){state.owner=b.dataset.owner;state.view='owners';$('ownerFilter').value=state.owner;state.search='';render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.period){state.period=b.dataset.period;state.view='plan';state.search='';render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.planFilter){state.period=b.dataset.planFilter;render()}if(b.dataset.status){state.status=b.dataset.status;state.page=1;render()}if(b.dataset.page){state.page+=Number(b.dataset.page);render()}if(b.dataset.record)openDetail(b.dataset.record);if(b.dataset.export)exportCsv(b.dataset.export)});
$('workstreamFilter').addEventListener('change',e=>{state.workstream=e.target.value;if(state.workstream==='non-BOM'){state.owner='all';$('ownerFilter').value='all'}$('ownerFilter').disabled=state.workstream==='non-BOM';state.page=1;render()});
$('ownerFilter').addEventListener('change',e=>{state.owner=e.target.value;state.page=1;render()});
$('weekAnchor').value=ASOF;$('weekAnchor').addEventListener('change',e=>{if(!e.target.value)return;state.week=e.target.value;state.page=1;render()});
$('resetBtn').addEventListener('click',()=>{Object.assign(state,{workstream:'all',owner:'all',week:ASOF,period:'this',search:'',status:'all',page:1,sort:'date'});$('workstreamFilter').value='all';$('ownerFilter').value='all';$('ownerFilter').disabled=false;$('weekAnchor').value=ASOF;render()});
$('methodBtn').addEventListener('click',()=>$('methodDialog').showModal());
for(const o of [...new Set(DATA.records.map(r=>r.owner))].sort((a,b)=>a.localeCompare(b,'zh-CN'))){let op=document.createElement('option');op.value=o;op.textContent=o;$('ownerFilter').append(op)}
$('asofLabel').textContent=dateLong(ASOF);$('sourceFooter').textContent=`来源：${META.sourceFile} · BOM 清单第 2–73 行`;$('methodBody').innerHTML=methodContent();
document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}}));
render();
</script>
</body></html>
